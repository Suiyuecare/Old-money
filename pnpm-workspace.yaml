packages:
  - "."

allowBuilds:
  esbuild: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - react-email@6.9.1
  - minimatch@10.2.6

# Audited transitive replacements for upstream packages that still resolve
# pre-advisory versions within their declared ranges.
overrides:
  "glob>minimatch": "10.2.6"
  "next>postcss": "8.5.20"
  "next>sharp": "0.35.3"
