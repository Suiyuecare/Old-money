project_id = "lignee-commerce-local"

[api]
enabled = true
port = 54321
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/admin/invite/confirm",
  "https://estatelignee.com/admin/invite/confirm",
]
enable_signup = false

[auth.email.template.invite]
subject = "LIGNÉE 後台邀請"
content_path = "./supabase/templates/invite.html"

[storage]
enabled = true
file_size_limit = "20MiB"

[realtime]
enabled = false
